<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑膠猜歌遊戲</title>
<style>
  :root{
    --bg1:#1a1030;
    --bg2:#0d0818;
    --accent:#ff5fa2;
    --accent2:#5fd0ff;
    --gold:#ffcf5c;
    --green:#4ade80;
    --red:#f87171;
    --card:#231a3d;
    --text:#f4f1fb;
    --muted:#a89dc4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:radial-gradient(circle at 20% 10%, #341b52 0%, var(--bg1) 40%, var(--bg2) 100%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  h1{
    text-align:center;
    font-size:clamp(24px,5vw,34px);
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    margin:0 0 28px;
    font-size:14px;
  }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------- 開始畫面 ---------- */
  .diff-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .diff-card{
    background:var(--card);
    border:2px solid transparent;
    border-radius:16px;
    padding:18px 16px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    font-family:inherit;
  }
  .diff-card:hover{ transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .diff-card:active{ transform:translateY(0); }
  .diff-card .name{ font-size:20px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
  .diff-card .meta{ font-size:13px; color:var(--muted); line-height:1.6; }
  .diff-easy{ border-color:#4ade8055; } .diff-easy:hover{ border-color:var(--green); }
  .diff-hard{ border-color:#ffcf5c55; } .diff-hard:hover{ border-color:var(--gold); }
  .diff-boss{ border-color:#f8717155; } .diff-boss:hover{ border-color:var(--red); }
  .diff-random{ border-color:#5fd0ff55; grid-column:1 / -1;} .diff-random:hover{ border-color:var(--accent2); }
  .badge{ font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.08); }

  /* ---------- 遊戲畫面 ---------- */
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    font-size:14px;
    color:var(--muted);
  }
  .hud .pill{
    background:var(--card);
    padding:6px 14px;
    border-radius:999px;
  }
  .mp-chip{
    background:var(--card);
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    color:var(--muted);
    border:1px solid transparent;
  }
  .mp-chip.me{
    color:var(--text);
    border-color:var(--accent2);
    font-weight:700;
  }
  .mp-chip.winner{
    border-color:var(--green);
  }
  .stage-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:8px;
  }
  .record-stage{
    position:relative;
    width:280px;
    height:280px;
    max-width:80vw;
    max-height:80vw;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    box-shadow:0 0 0 6px #120a22, 0 20px 40px rgba(0,0,0,.5);
  }
  .video-crop{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius:50%;
  }
  .video-crop iframe{
    position:absolute;
    top:50%; left:50%;
    width:280px; height:498px;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .cover-img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    z-index:2;
  }
  /* 揭曉時改成顯示真正的影片（歌詞版影片才看得到歌詞），不再蓋一張靜態封面圖 */
  .record-stage.revealed .cover-img{ opacity:0; }

  .reveal-caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:14px 10px 10px;
    text-align:center;
    background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
    opacity:0;
    transition:opacity .4s ease .3s;
    z-index:6;
  }
  .reveal-caption .t{ font-weight:700; font-size:16px; }
  .reveal-caption .a{ font-size:13px; color:var(--muted); }
  .record-stage.revealed .reveal-caption{ opacity:1; }

  .vinyl{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        #161018 0px, #161018 3px,
        #201829 3px, #201829 6px);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .7s cubic-bezier(.55,0,.1,1), opacity .7s ease;
    z-index:5;
  }
  .vinyl::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.04);
    box-shadow:0 0 0 30px rgba(255,255,255,.02) inset;
  }
  .vinyl.spinning{ animation:spin 2.6s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .vinyl.opened{
    transform:translateY(-135%) rotate(-35deg) scale(.9);
    opacity:0;
    pointer-events:none;
  }
  .label{
    width:96px; height:96px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent), #8a1655 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 3px #0d0818, 0 4px 14px rgba(0,0,0,.5);
  }
  .play-btn{
    width:64px; height:64px;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:#231a3d;
    font-size:26px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }
  .play-hint{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin:10px 0 20px;
    min-height:16px;
  }
  .clip-bar{
    width:200px;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    margin:8px auto 0;
    overflow:hidden;
  }
  .clip-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
  }
  .clip-bar-fill.animating{ transition:width linear; }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .choice-btn{
    background:var(--card);
    border:2px solid transparent;
    color:var(--text);
    padding:14px 12px;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
    text-align:center;
    font-family:inherit;
    transition:border-color .15s ease, transform .1s ease;
  }
  .choice-btn:hover:not(:disabled){ border-color:var(--accent2); transform:translateY(-2px); }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--green); background:#1f3a2c; }
  .choice-btn.wrong{ border-color:var(--red); background:#3a1f24; }

  .next-wrap{ text-align:center; margin-top:20px; }
  .btn-main{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;
    color:#1a1030;
    font-weight:700;
    padding:12px 28px;
    border-radius:999px;
    font-size:15px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--muted);
    color:var(--text);
    padding:11px 24px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    margin-left:10px;
  }

  /* ---------- 結果畫面 ---------- */
  .score-big{
    text-align:center;
    font-size:44px;
    font-weight:800;
    background:linear-gradient(90deg,var(--gold),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:6px 0 4px;
  }
  .score-sub{ text-align:center; color:var(--muted); margin-bottom:20px; font-size:14px;}
  .result-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border-radius:10px; padding:10px 14px; font-size:13px;
  }
  .result-row .rt{ font-weight:600; }
  .result-row .ra{ color:var(--muted); font-size:12px; }
  .result-row .mark{ font-size:16px; }
  .result-row.wrong .mark{ color:var(--red); }
  .result-row.correct .mark{ color:var(--green); }
  .actions-center{ text-align:center; }

  #yt-player-holder{ position:absolute; width:0; height:0; overflow:hidden; }

  /* ---------- 房間聊天室 ---------- */
  #mp-chat{ position:fixed; right:16px; bottom:16px; z-index:50; display:none; }
  #mp-chat-toggle{
    position:relative;
    border:none; border-radius:999px; padding:12px 18px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#1a1030; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  #mp-chat-badge{
    position:absolute; top:-6px; right:-6px;
    background:var(--red); color:#fff; font-size:11px; font-weight:700;
    min-width:18px; height:18px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  #mp-chat-panel{
    display:none;
    position:absolute; right:0; bottom:56px;
    width:min(300px, calc(100vw - 32px)); height:360px;
    background:var(--card); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,0.45);
    flex-direction:column; overflow:hidden;
  }
  #mp-chat-panel.open{ display:flex; }
  #mp-chat-messages{
    flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  .mp-chat-msg{ max-width:85%; }
  .mp-chat-msg .who{ font-size:11px; color:var(--muted); margin-bottom:2px; }
  .mp-chat-msg .bubble{
    background:rgba(255,255,255,0.06); color:var(--text);
    padding:6px 10px; border-radius:10px; font-size:13px; word-break:break-word;
  }
  .mp-chat-msg.me{ align-self:flex-end; }
  .mp-chat-msg.me .who{ text-align:right; }
  .mp-chat-msg.me .bubble{ background:var(--accent); color:#1a1030; }
  .mp-chat-msg.system{ align-self:center; }
  .mp-chat-msg.system .bubble{ background:transparent; color:var(--muted); font-size:12px; padding:2px; }
  #mp-chat-form{
    display:flex; gap:6px; padding:10px; border-top:1px solid rgba(255,255,255,0.08);
  }
  #mp-chat-input{
    flex:1; min-width:0; padding:9px 12px; border-radius:999px;
    border:1px solid var(--muted); background:var(--bg2); color:var(--text); font-size:13px;
  }
  #mp-chat-send{
    border:none; border-radius:999px; padding:9px 14px;
    background:var(--accent2); color:#0d0818; font-weight:700; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎵 黑膠猜歌 🎵</h1>
  <div id="api-warning" style="display:none; background:#4a1f24; border:1px solid var(--red); color:#ffd9d9; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; text-align:center;">
    ⚠️ 無法連上 YouTube 播放服務。請確認裝置有網路連線、關閉廣告攔截 / 隱私外掛（可能封鎖 youtube.com），再重新整理頁面。
  </div>

  <!-- 年代篩選畫面 -->
  <section id="screen-era" class="screen active">
    <p style="text-align:center; color:var(--muted); margin:0 0 18px;">先選一個歌曲年代範圍</p>
    <div class="diff-grid">
      <button class="diff-card diff-easy" data-era="pre90">
        <div class="name">🕰️ 懷舊金曲</div>
        <div class="meta">70~90 年代老歌<br>鄧麗君、羅大佑、張學友…</div>
      </button>
      <button class="diff-card diff-hard" data-era="post90">
        <div class="name">🎧 千禧新聲</div>
        <div class="meta">2000 年代以後<br>周杰倫、五月天、鄧紫棋…</div>
      </button>
      <button class="diff-card diff-random" data-era="mixed">
        <div class="name">🎲 大亂鬥 <span class="badge">不限年代</span></div>
        <div class="meta">70 年代到現在通通有機會出現</div>
      </button>
    </div>
  </section>

  <!-- 難度選擇畫面 -->
  <section id="screen-start" class="screen">
    <p style="text-align:center; color:var(--muted); margin:0 0 14px; font-size:13px;">
      目前年代：<span id="era-label">-</span>
      <button class="btn-ghost" id="change-era-btn" style="margin-left:4px; padding:3px 12px; font-size:12px;">🔄 換年代</button>
    </p>
    <div class="diff-grid">
      <button class="diff-card diff-easy" data-diff="easy">
        <div class="name">🟢 簡單</div>
        <div class="meta">4 題・每段 10 秒<br>入門好上手</div>
      </button>
      <button class="diff-card diff-hard" data-diff="hard">
        <div class="name">🟡 困難</div>
        <div class="meta">6 題・每段 8 秒<br>片段變短，題目變多</div>
      </button>
      <button class="diff-card diff-boss" data-diff="boss">
        <div class="name">🔴 魔王</div>
        <div class="meta">8 題・每段 5 秒<br>耳力大考驗</div>
      </button>
      <button class="diff-card diff-random" data-diff="random">
        <div class="name">🔀 隨機 <span class="badge">混合三種難度</span></div>
        <div class="meta">4~8 題隨機・每題難度也隨機（簡單/困難/魔王混戰）</div>
      </button>
    </div>
    <div style="text-align:center; margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-main" id="go-timed-btn">⏱️ 計時挑戰</button>
      <button class="btn-main" id="go-mp-btn">🔗 連線對戰</button>
    </div>
  </section>

  <!-- 計時挑戰：選題數 -->
  <section id="screen-timed-select" class="screen">
    <p style="text-align:center; color:var(--muted); margin:0 0 18px;">選擇題數，比比看你能多快答完全部題目</p>
    <div class="diff-grid">
      <button class="diff-card diff-easy" data-timed-count="10">
        <div class="name">⏱️ 10 題</div>
        <div class="meta">最佳紀錄：<span id="timed-best-10">尚無紀錄</span></div>
      </button>
      <button class="diff-card diff-hard" data-timed-count="20">
        <div class="name">⏱️ 20 題</div>
        <div class="meta">最佳紀錄：<span id="timed-best-20">尚無紀錄</span></div>
      </button>
      <button class="diff-card diff-random" data-timed-count="30">
        <div class="name">⏱️ 30 題</div>
        <div class="meta">最佳紀錄：<span id="timed-best-30">尚無紀錄</span></div>
      </button>
    </div>
    <div style="text-align:center; margin-top:18px;">
      <button class="btn-ghost" id="timed-back-btn">← 返回</button>
    </div>
  </section>

  <!-- 連線對戰：建立/加入房間 -->
  <section id="screen-mp-menu" class="screen">
    <p style="text-align:center; color:var(--muted); margin:0 0 14px;">建立一個房間邀朋友加入，或輸入朋友給你的房號（最多 8 人）</p>
    <div class="actions-center" style="margin-bottom:10px;">
      <input id="mp-name" maxlength="10" placeholder="你的名字（可留空）"
        style="width:220px; padding:11px 14px; border-radius:999px; border:1px solid var(--muted); background:var(--card); color:var(--text); font-size:15px; text-align:center;">
    </div>
    <div class="actions-center" style="margin-bottom:24px;">
      <button class="btn-main" id="mp-create-btn">➕ 建立房間</button>
    </div>
    <div style="display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap;">
      <input id="mp-join-code" maxlength="4" inputmode="numeric" placeholder="輸入 4 位房號"
        style="width:150px; padding:11px 14px; border-radius:999px; border:1px solid var(--muted); background:var(--card); color:var(--text); font-size:15px; text-align:center; letter-spacing:2px;">
      <button class="btn-main" id="mp-join-btn">加入房間</button>
    </div>
    <p id="mp-join-error" style="text-align:center; color:var(--red); font-size:13px; min-height:18px; margin-top:8px;"></p>
    <div style="text-align:center; margin-top:6px;">
      <button class="btn-ghost" id="mp-menu-back-btn" style="margin-left:0;">← 返回</button>
    </div>
  </section>

  <!-- 連線對戰：等待房間 -->
  <section id="screen-mp-lobby" class="screen">
    <p style="text-align:center; color:var(--muted); margin:0 0 6px;">房號</p>
    <div class="score-big" id="mp-lobby-code">----</div>
    <p style="text-align:center; color:var(--muted); font-size:13px; margin:6px 0 20px;" id="mp-lobby-share">
      請朋友打開這個網址：<br>
      <span id="mp-lobby-url" style="color:var(--accent2);">-</span><br>
      再輸入這個房號加入
    </p>
    <p style="text-align:center;" id="mp-lobby-status">⏳ 等待對方加入…</p>
    <div id="mp-lobby-players" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0;"></div>

    <div id="mp-lobby-diffpick" class="diff-grid" style="display:none; margin-top:16px;">
      <button class="diff-card diff-easy" data-mpstartdiff="easy">
        <div class="name">🟢 簡單</div><div class="meta">4 題・每段 10 秒</div>
      </button>
      <button class="diff-card diff-hard" data-mpstartdiff="hard">
        <div class="name">🟡 困難</div><div class="meta">6 題・每段 8 秒</div>
      </button>
      <button class="diff-card diff-boss" data-mpstartdiff="boss">
        <div class="name">🔴 魔王</div><div class="meta">8 題・每段 5 秒</div>
      </button>
      <button class="diff-card diff-random" data-mpstartdiff="random">
        <div class="name">🔀 隨機</div><div class="meta">4~8 題・難度隨機</div>
      </button>
    </div>

    <div class="actions-center">
      <button class="btn-ghost" id="mp-lobby-leave-btn">離開房間</button>
    </div>
  </section>

  <!-- 連線對戰：結算 -->
  <section id="screen-mp-result" class="screen">
    <div class="score-big" id="mp-result-title">-</div>
    <p class="score-sub" id="mp-result-sub">-</p>
    <div class="result-list" id="mp-result-list" style="max-width:320px; margin:0 auto 20px;"></div>
    <div class="actions-center">
      <button class="btn-main" id="mp-result-lobby-btn">回到房間</button>
    </div>
  </section>

  <!-- 遊戲進行畫面（單人 / 連線共用） -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <span class="pill" id="hud-progress">第 1 / 4 題</span>
      <span class="pill" id="hud-diff">簡單</span>
      <span class="pill" id="hud-timer" style="display:none;">00:00</span>
      <span class="pill" id="hud-score">分數 0</span>
    </div>
    <div id="mp-scoreboard-row" style="display:none; flex-wrap:wrap; gap:6px; justify-content:center; margin:-6px 0 16px;"></div>

    <div class="stage-wrap">
      <div class="record-stage" id="record-stage">
        <div class="video-crop"><div id="yt-player"></div></div>
        <img class="cover-img" id="cover-img" alt="">
        <div class="vinyl" id="vinyl">
          <div class="label">
            <div class="play-btn" id="play-btn"></div>
          </div>
        </div>
        <div class="reveal-caption">
          <div class="t" id="reveal-title">-</div>
          <div class="a" id="reveal-artist">-</div>
        </div>
      </div>
    </div>
    <div id="playback-status">
      <p class="play-hint" id="play-hint">準備中…</p>
      <div class="clip-bar"><div class="clip-bar-fill" id="clip-bar-fill"></div></div>
      <div style="text-align:center; margin-top:10px;">

  easy:   { label:"簡單", clipSeconds:10, questionCount:4 },
  hard:   { label:"困難", clipSeconds:8,  questionCount:6 },

/* ===================== 年代篩選（復古 / 新潮 / 大亂鬥） ===================== */
const ERA_LABELS = { pre90:"懷舊金曲（70~90 年代）", post90:"千禧新聲（2000 年代以後）", mixed:"大亂鬥（不限年代）" };
let selectedEra = 'mixed';
function eraPool(){
  if(selectedEra === 'pre90') return SONGS.filter(s=>s.era === 'pre90');
  if(selectedEra === 'post90') return SONGS.filter(s=>s.era === 'post90');
  return SONGS;
}

/* ===================== 難度不綁歌曲，改成綁「播放哪一段」 =====================
   每首歌都收錄了一個「最好認的段落」(通常是副歌) 當作 song.start。
   簡單：就播那一段。困難：往前抓主歌的位置。魔王：抓最接近開頭、最難認的位置。
   所有歌在任何難度都可能被抽到，差別只在播放片段的位置跟長度。
======================================================= */
const TIER_CLIP_SECONDS = { easy:10, hard:8, boss:5 };

function segmentStartFor(song, level){
  const base = song.start;
  if(level === 'easy') return base;
  if(level === 'hard') return Math.max(10, Math.round(base * 0.6));
  // 魔王：原本 15% 對大多數預設 start:50 的歌曲會落在 7~8 秒，還在前奏、根本沒人聲，聽了也認不出來。
  // 提高地板到 10 秒、比例拉到 30%，讓片段至少落在主歌有人聲的地方，維持「比困難更早、更難猜」但仍聽得出來。
  return Math.max(10, Math.round(base * 0.3)); // boss
}

function makeQuestionSong(baseSong, level){
  return Object.assign({}, baseSong, { start: segmentStartFor(baseSong, level) });
}

function buildRandomQuestions(){
  const count = 4 + Math.floor(Math.random()*5); // 4~8
  const levels = ['easy','hard','boss'];
  const pool = shuffle(eraPool());
  const questions = [];
  for(let i=0;i<count && i<pool.length;i++){
    const level = levels[Math.floor(Math.random()*3)];
    questions.push({ song: makeQuestionSong(pool[i], level), clipSeconds: TIER_CLIP_SECONDS[level] });
  }
  return questions;
}

/* ===================== 共用工具 ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ===================== 遊戲狀態 ===================== */
let ytPlayer = null;
let ytReady = false;
let pendingCue = null;

let state = {
  diffKey:null,
  questions:[],   // [{song, clipSeconds}]
  index:0,
  score:0,
  answered:false,
  answers:[],     // {song, clipSeconds, chosen, correct}
  isPlaying:false,
  clipElapsedMs:0,    // 這題目前已經播放掉的毫秒數（暫停會保留）
  rafId:null,
  lastTickTs:0,
  countdownTimer:null,
};

/* ===================== 倒數嗶聲（跟 YouTube 無關，純瀏覽器音效） ===================== */
function beep(freq, dur){
  try{
    if(!beep.ctx) beep.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = beep.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }catch(err){ console.warn('beep failed', err); }
}

function clearCountdown(){
  if(state.countdownTimer){ clearInterval(state.countdownTimer); state.countdownTimer = null; }
}

function startCountdown(){
  clearCountdown();
  let n = 3;
  const label = document.getElementById('play-btn');
  label.textContent = String(n);
  document.getElementById('play-hint').textContent = `即將自動播放…${n}`;
  beep(660, 0.12);
  state.countdownTimer = setInterval(()=>{
    n--;
    if(n > 0){
      label.textContent = String(n);
      document.getElementById('play-hint').textContent = `即將自動播放…${n}`;
      beep(660, 0.12);
    } else {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      beep(1046, 0.18);
      revealAudio();
    }
  }, 1000);
}

function revealAudio(retries){
  retries = retries || 0;
  if(state.answered) return;
  if(!ytPlayer || !ytReady){
    if(retries > 20){
      document.getElementById('play-hint').textContent = '⚠️ 播放器一直連不上，請按下方「跳過」看答案';
      return;
    }
    setTimeout(()=>revealAudio(retries+1), 300);
    return;
  }
  startPlayback();
}

// 計時挑戰用：用播放器實際狀態判斷影片是否已經吃進去（不是還沒開始的 -1），
// 而不是用固定的等待時間，這樣第一首歌（播放器冷啟動、載入較久）跟後面幾首都能適應
function waitForCueThenPlay(deadline){
  if(deadline === undefined){
    // 第一次呼叫：cueVideoById 剛送出，讀取的狀態可能還是上一首歌殘留的舊值（還沒真正生效），
    // 先等一小段時間讓它真的更新，不要在同一個 tick 就去判斷
    setTimeout(()=>waitForCueThenPlay(Date.now() + 2000), 120);
    return;
  }
  if(state.answered) return;
  let st = -1;
  try{ st = ytPlayer.getPlayerState(); }catch(err){}
  if(st !== -1 || Date.now() >= deadline){
    revealAudio();
  } else {
    setTimeout(()=>waitForCueThenPlay(deadline), 80);
  }
}

/* ===================== YouTube IFrame API ===================== */
window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('yt-player', {
    height: '498',
    width: '280',
    playerVars:{
      controls:0, disablekb:1, modestbranding:1, rel:0,
      iv_load_policy:3, fs:0, playsinline:1, origin: location.origin
    },
    events:{
      onReady: function(){
        ytReady = true;
        hideApiWarning();
        if(pendingCue){ primeSong(pendingCue); pendingCue = null; }
      },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
};
(function loadYT(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
  setTimeout(()=>{ if(!ytReady) showApiWarning(); }, 6000);
})();

// 瀏覽器的自動播放政策要求「使用者手勢」之後才允許出聲。玩家在選單上的第一次點擊
// 就是合法的手勢，趁這個時機先叫播放器解鎖音訊，第一首歌才不會被瀏覽器擋成靜音。
(function unlockAudioOnFirstGesture(){
  let done = false;
  function unlock(){
    if(done) return;
    done = true;
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('keydown', unlock, true);
    try{
      if(ytPlayer && ytPlayer.unMute){
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        ytPlayer.mute(); // 立刻靜音回去，避免在選單上就發出聲音；權限已經拿到了
      }
    }catch(err){}
  }
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
})();

function showApiWarning(){
  const el = document.getElementById('api-warning');
  if(el) el.style.display = 'block';
}
function hideApiWarning(){
  const el = document.getElementById('api-warning');
  if(el) el.style.display = 'none';
}

let awaitingPlayStart = false;
let playWatchdog = null;

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING && awaitingPlayStart){
    awaitingPlayStart = false;
    clearTimeout(playWatchdog);
    unmuteAndGo();
  }
}

const YT_ERROR_MESSAGES = {
  2: '影片參數錯誤（無效的 video ID）',
  5: '此瀏覽器的 HTML5 播放器發生錯誤',
  100: '找不到這部影片（可能已下架或設為不公開）',
  101: '影片擁有者停用了嵌入播放',
  150: '影片擁有者停用了嵌入播放',
};
function onPlayerError(e){
  awaitingPlayStart = false;
  clearTimeout(playWatchdog);
  stopProgressLoop();
  setPlayingUI(false);

  // YouTube 的 IFrame API 偶爾會在剛切歌／剛初始化時丟出一次性的假錯誤（尤其是錯誤碼 2），
  // 重新 cue 一次通常就會恢復正常，所以先靜默重試幾次，真的一直失敗才顯示錯誤訊息給玩家看
  const q = state.questions[state.index];
  state.errorRetryCount = (state.errorRetryCount || 0) + 1;
  if(state.errorRetryCount <= 2 && q && q.song && !state.answered){
    console.warn('[猜歌遊戲] YouTube player error', e.data, '正在自動重試第', state.errorRetryCount, '次');
    // 如果錯誤發生在已經要開始播放（取消靜音）之後，重新 cue 完不會自動再播一次，
    // 一定要記得再觸發一次「等載入好就播放」，不然重試完影片會卡在靜音、永遠沒聲音
    // （一般模式因為還有獨立的倒數計時器會自然補救，但計時挑戰沒有倒數，這步不能漏掉）
    const needsReplay = state.playbackStarted;
    setTimeout(()=>{
      if(state.answered) return;
      cueSong(q.song);
      if(needsReplay) waitForCueThenPlay();
    }, 500);
    return;
  }

  const detail = YT_ERROR_MESSAGES[e.data] || ('未知錯誤代碼 ' + e.data);
  document.getElementById('play-hint').textContent = `⚠️ 播放失敗：${detail}（錯誤碼 ${e.data}）。請用下方「跳過」看答案`;
  console.error('[猜歌遊戲] YouTube player error', e.data, '目前題目 videoId =', q && q.song && q.song.videoId);
}

function cueSong(song){
  const opts = { videoId: song.videoId, startSeconds: song.start };
  if(ytReady && ytPlayer && ytPlayer.cueVideoById){
    primeSong(opts);
  } else {
    pendingCue = opts;
  }
}

// 一開始就靜音把影片播起來（藏在黑膠後面），倒數結束後只要「取消靜音」即可，
// 全程不呼叫 pauseVideo/playVideo 來做暫停/繼續，避免 YouTube 自己的播放/暫停圖示閃出來
function primeSong(opts){
  try{
    ytPlayer.mute();
    ytPlayer.cueVideoById(opts);
    setTimeout(()=>{ try{ ytPlayer.playVideo(); }catch(err){} }, 50);
  }catch(err){ console.warn('primeSong failed', err); }
}

/* ===================== 開始遊戲 ===================== */

function startGame(diffKey){
  stopTimedTimer();
  let questions;
  if(diffKey === 'random'){
    questions = buildRandomQuestions();
  } else {
    const diff = DIFFICULTIES[diffKey];
    const pool = shuffle(eraPool());
    const picked = pool.slice(0, diff.questionCount);
    questions = picked.map(song=>({ song: makeQuestionSong(song, diffKey), clipSeconds: diff.clipSeconds }));
  }

  state = { diffKey, questions, index:0, score:0, answered:false, answers:[],
    isPlaying:false, clipElapsedMs:0, rafId:null, lastTickTs:0, countdownTimer:null };
  document.getElementById('hud-diff').textContent = DIFFICULTIES[diffKey].label;
  document.getElementById('hud-score').style.display = '';
  document.getElementById('hud-timer').style.display = 'none';
  document.getElementById('mp-scoreboard-row').style.display = 'none';
  showScreen('screen-game');
  loadQuestion();
}

/* ===================== 計時挑戰模式（10/20/30 題測秒數，本機存最佳紀錄） ===================== */
const TIMED_TIER = 'easy';
let timedTimerInterval = null;

function stopTimedTimer(){
  if(timedTimerInterval){ clearInterval(timedTimerInterval); timedTimerInterval = null; }
}
function timedRecordKey(count){ return 'timedBest_' + selectedEra + '_' + count; }
function getTimedBest(count){
  const v = Number(localStorage.getItem(timedRecordKey(count)));
  return (v && v > 0) ? v : null;
}
function saveTimedBest(count, ms){
  const cur = getTimedBest(count);
  if(!cur || ms < cur){ localStorage.setItem(timedRecordKey(count), String(ms)); return true; }
  return false;
}
function formatDuration(ms){
  if(ms == null) return '尚無紀錄';
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return (m>0 ? m+'分' : '') + String(s).padStart(m>0?2:1,'0') + '秒';
}
function formatClock(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

document.getElementById('go-timed-btn').addEventListener('click', ()=>{
  [10,20,30].forEach(count=>{
    document.getElementById('timed-best-'+count).textContent = formatDuration(getTimedBest(count));
  });
  showScreen('screen-timed-select');
});
document.getElementById('timed-back-btn').addEventListener('click', ()=> showScreen('screen-start'));
document.querySelectorAll('#screen-timed-select [data-timed-count]').forEach(btn=>{
  btn.addEventListener('click', ()=> startTimedGame(Number(btn.dataset.timedCount)));
});

function startTimedGame(count){
  stopTimedTimer();
  const pool = shuffle(eraPool());
  const picked = pool.slice(0, count);
  const questions = picked.map(song=>({ song: makeQuestionSong(song, TIMED_TIER), clipSeconds: TIER_CLIP_SECONDS[TIMED_TIER] }));

  state = { diffKey:null, questions, index:0, score:0, answered:false, answers:[],
    isPlaying:false, clipElapsedMs:0, rafId:null, lastTickTs:0, countdownTimer:null,
    timedMode:true, timedCount:count, timedStartedAt:Date.now(), timedElapsedMs:0, timedIsNewRecord:false };

  document.getElementById('hud-diff').textContent = `⏱️ ${count} 題計時`;
  document.getElementById('hud-score').style.display = '';
  document.getElementById('hud-timer').style.display = '';
  document.getElementById('hud-timer').textContent = '00:00';
  document.getElementById('mp-scoreboard-row').style.display = 'none';
  showScreen('screen-game');
  loadQuestion();

  timedTimerInterval = setInterval(()=>{
    document.getElementById('hud-timer').textContent = formatClock(Date.now() - state.timedStartedAt);
  }, 200);
}

/* ===================== 載入題目 ===================== */
function loadQuestion(){
  stopProgressLoop();
  clearCountdown();
  clearTimeout(playWatchdog);
  awaitingPlayStart = false;
  state.isPlaying = false;
  state.clipElapsedMs = 0;
  state.errorRetryCount = 0;
  state.playbackStarted = false;
  const q = state.questions[state.index];

  document.getElementById('hud-progress').textContent = `第 ${state.index+1} / ${state.questions.length} 題`;
  document.getElementById('hud-score').textContent = `分數 ${state.score}`;
  document.getElementById('next-wrap').style.display = 'none';

  const stage = document.getElementById('record-stage');
  stage.classList.remove('revealed');
  const vinyl = document.getElementById('vinyl');
  // 黑膠要「瞬間」蓋回去，不要用掀開時的那段動畫，先關掉 transition 再切 class
  vinyl.style.transition = 'none';
  vinyl.classList.remove('opened');
  vinyl.classList.remove('spinning');
  void vinyl.offsetWidth; // 強制重繪，讓上面的瞬間位移生效
  vinyl.style.transition = '';
  // 提前把封面圖載入好（但還是隱藏的），掀黑膠時才不會有空窗期看到底下的 MV
  document.getElementById('cover-img').src = `https://img.youtube.com/vi/${q.song.videoId}/hqdefault.jpg`;

  document.getElementById('skip-btn').disabled = false;
  document.getElementById('skip-btn').style.display = '';
  document.getElementById('playback-status').style.display = '';
  resetClipBar();

  cueSong(q.song);
  state.answered = false;

  renderChoices(q.song);
  document.getElementById('choices').style.display = 'none';

  if(state.timedMode){
    // 計時挑戰全程不倒數，但完全不等待會搶在 cueVideoById 剛送出、影片還沒真正載入前
    // 就呼叫 playVideo()，導致播放器卡住沒反應。第一首歌是播放器「冷啟動」，
    // 載入時間比後面幾首明顯更久，固定等一個短時間不夠用，所以改成用播放器實際狀態判斷
    // （只要不是還沒開始的 -1 狀態就代表已經吃到新影片），最多等 2 秒保底。
    document.getElementById('play-btn').textContent = '';
    waitForCueThenPlay();
  } else {
    startCountdown();
  }
}

function renderChoices(correctSong){
  const others = shuffle(eraPool().filter(s=>s.id !== correctSong.id)).slice(0,3);
  const options = shuffle([correctSong, ...others]);

  const wrap = document.getElementById('choices');
  wrap.innerHTML = '';
  options.forEach(song=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = song.title;
    b.addEventListener('click', ()=> onChoose(song, correctSong, b));
    wrap.appendChild(b);
  });
}

/* ===================== 揭曉聲音（取消靜音，不呼叫播放/暫停） ===================== */
function startPlayback(){
  state.playbackStarted = true;
  const q = state.questions[state.index];
  clearTimeout(playWatchdog);
  document.getElementById('play-hint').textContent = `片段長度 ${q.clipSeconds} 秒 · 播放中…`;

  const isAlreadyPlaying = ytPlayer.getPlayerState && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
  if(isAlreadyPlaying){
    unmuteAndGo();
  } else {
    // 靜音預播還沒真正開始（可能還在緩衝），先確保有呼叫播放，等 onPlayerStateChange 確認後再取消靜音
    awaitingPlayStart = true;
    nudgePlayVideo(0);
  }
}

// 只呼叫一次 playVideo() 有時候會被吃掉（尤其是剛切換到新影片、上一首的狀態還沒完全清乾淨的時候），
// 所以改成每 1.5 秒重新喊一次播放，喊到真的開始播放或到達重試上限才放棄
function nudgePlayVideo(attempt){
  if(!awaitingPlayStart) return;
  try{ ytPlayer.playVideo(); }catch(err){ console.warn('playVideo failed', err); }
  if(attempt < 4){
    playWatchdog = setTimeout(()=> nudgePlayVideo(attempt + 1), 1500);
  } else {
    playWatchdog = setTimeout(()=>{
      if(awaitingPlayStart){
        awaitingPlayStart = false;
        if(!state.answered){
          document.getElementById('play-hint').textContent = '⚠️ 播放似乎卡住了，請確認網路連線正常，或按「跳過」直接看答案';
        }
      }
    }, 1500);
  }
}

function unmuteAndGo(){
  try{ ytPlayer.unMute(); ytPlayer.setVolume(100); }catch(err){ console.warn('unMute failed', err); }
  document.getElementById('choices').style.display = 'grid';
  setPlayingUI(true);
  if(!state.rafId) startProgressLoop();
  // 瀏覽器的自動播放政策：整個頁面第一次「把聲音打開」時，很可能會被擋下來，
  // 甚至直接把影片暫停掉（第二首之後因為網站已經累積播放紀錄就會放行，
  // 這正是「只有第一首沒聲音」的典型症狀）。所以這裡回頭驗證有沒有真的成功，
  // 沒成功就再試一次。
  verifyAudible(0);
}

function verifyAudible(attempt){
  if(attempt > 5) return;
  setTimeout(()=>{
    if(state.answered || !state.playbackStarted) return;
    let st = null, muted = true;
    try{ st = ytPlayer.getPlayerState(); muted = ytPlayer.isMuted(); }catch(err){ return; }
    const playing = (st === YT.PlayerState.PLAYING);
    if(playing && !muted) return; // 真的有聲音在播了，收工
    console.warn('[猜歌遊戲] 聲音沒有成功打開（state=' + st + ', muted=' + muted + '），重試第 ' + (attempt+1) + ' 次');
    try{
      if(muted){ ytPlayer.unMute(); ytPlayer.setVolume(100); }
      if(!playing){ ytPlayer.playVideo(); }
    }catch(err){}
    verifyAudible(attempt + 1);
  }, 400);
}

function setPlayingUI(isPlaying){
  state.isPlaying = isPlaying;
  document.getElementById('play-btn').textContent = '';
  document.getElementById('vinyl').classList.toggle('spinning', isPlaying);
}

function startProgressLoop(){
  const q = state.questions[state.index];
  const totalMs = q.clipSeconds * 1000;
  const fill = document.getElementById('clip-bar-fill');
  state.lastTickTs = performance.now();

  function tick(now){
    state.clipElapsedMs += now - state.lastTickTs;
    state.lastTickTs = now;
    const pct = Math.min(100, (state.clipElapsedMs / totalMs) * 100);
    fill.style.width = pct + '%';

    if(state.clipElapsedMs >= totalMs){
      onClipLimitReached();
      return;
    }
    state.rafId = requestAnimationFrame(tick);
  }
  state.rafId = requestAnimationFrame(tick);
}

function stopProgressLoop(){
  if(state.rafId){ cancelAnimationFrame(state.rafId); state.rafId = null; }
}

function onClipLimitReached(){
  stopProgressLoop();
  try{ ytPlayer.mute(); }catch(err){}
  setPlayingUI(false);
  if(!state.answered){
    document.getElementById('play-hint').textContent = '片段播完囉，選一個答案，或按「跳過」看答案';
  }
}

function resetClipBar(){
  stopProgressLoop();
  const fill = document.getElementById('clip-bar-fill');
  fill.style.width = '0%';
}

/* ===================== 作答 ===================== */
function onChoose(chosenSong, correctSong, btnEl){
  if(state.answered) return;
  const isCorrectPick = !!chosenSong && chosenSong.id === correctSong.id;

  state.answered = true;
  document.getElementById('choices').style.display = 'grid';
  stopProgressLoop();
  clearCountdown();
  clearTimeout(playWatchdog);
  awaitingPlayStart = false;
  state.isPlaying = false;
  document.getElementById('vinyl').classList.remove('spinning');
  document.getElementById('play-btn').textContent = '';
  document.getElementById('skip-btn').disabled = true;
  document.getElementById('playback-status').style.display = 'none';

  const isCorrect = isCorrectPick;
  if(isCorrect) state.score++;

  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === correctSong.title) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
  });

  state.answers.push({
    song: correctSong,
    chosen: chosenSong,
    correct: isCorrect,
    clipSeconds: state.questions[state.index].clipSeconds
  });

  document.getElementById('hud-score').textContent = `分數 ${state.score}`;

  if(state.timedMode && state.index === state.questions.length-1){
    stopTimedTimer();
    state.timedElapsedMs = Date.now() - state.timedStartedAt;
    document.getElementById('hud-timer').textContent = formatClock(state.timedElapsedMs);
    state.timedIsNewRecord = saveTimedBest(state.timedCount, state.timedElapsedMs);
  }

  revealVinyl(correctSong);

  document.getElementById('next-wrap').style.display = 'block';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.index === state.questions.length-1) ? '查看結果 →' : '下一題 →';
}

function revealVinyl(correctSong){
  document.getElementById('vinyl').classList.add('opened');
  document.getElementById('reveal-title').textContent = correctSong.title;
  document.getElementById('reveal-artist').textContent = correctSong.artist;

  // 封面圖已經在 loadQuestion() 就先偷偷載入好了，這裡只要切 class 讓它瞬間顯示
  document.getElementById('record-stage').classList.add('revealed');

  // 掀開後繼續播放：只取消靜音，不呼叫 playVideo()，避免觸發 YouTube 內建的播放圖示
  try{ ytPlayer.unMute(); ytPlayer.setVolume(100); }catch(err){ console.warn('unMute failed', err); }
}

document.getElementById('skip-btn').addEventListener('click', ()=>{
  if(state.answered) return;
  const q = state.questions[state.index];
  onChoose(null, q.song, null);
});

document.getElementById('next-btn').addEventListener('click', ()=>{

});

function showResult(){
  showScreen('screen-result');
  const total = state.questions.length;
  document.getElementById('result-score').textContent = `${state.score} / ${total}`;
  if(state.timedMode){
    const best = getTimedBest(state.timedCount);
    document.getElementById('result-sub').textContent = `⏱️ 完成時間 ${formatClock(state.timedElapsedMs)}` +
      (state.timedIsNewRecord ? '　🎉 新紀錄！' : `　最佳紀錄 ${formatDuration(best)}`);
  } else {
    document.getElementById('result-sub').textContent = `答對率 ${Math.round(state.score/total*100)}% · 難度：${DIFFICULTIES[state.diffKey].label}`;
  }

  const list = document.getElementById('result-list');
  list.innerHTML = '';
  state.answers.forEach(a=>{
    const row = document.createElement('div');
    row.className = 'result-row ' + (a.correct ? 'correct' : 'wrong');
    row.innerHTML = `
      <div>
        <div class="rt">${a.song.title}</div>
        <div class="ra">${a.song.artist}${a.correct ? '' : (a.chosen ? '　你選了：'+a.chosen.title : '　（跳過未作答）')}</div>
      </div>
      <div class="mark">${a.correct ? '✔' : '✘'}</div>
    `;
    list.appendChild(row);
  });
}

// 部署到 GitHub Pages 之類的靜態空間時，連線對戰的 API 要打去 Cloudflare Workers；
// 但在自己電腦用 _serve.ps1 開（localhost / 127.0.0.1 / 區網 IP）時，還是打本機相對路徑 /api/...
// 部署完 Worker 後，把下面這行網址換成你自己的 workers.dev 網址（wrangler deploy 完成後終端機會印出來）。
const CLOUD_API_BASE = "https://guess-song-game-api.YOUR-SUBDOMAIN.workers.dev";
function isLocalServer(){
  const h = location.hostname;
  return location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1'
    || /^192\.168\./.test(h) || /^10\./.test(h) || /^172\.(1[6-9]|2\d|3[0-1])\./.test(h);
}
const API_BASE = isLocalServer() ? '' : CLOUD_API_BASE;

let mp = {
  code: null,
  playerId: null,
  name: null,
  pollTimer: null,
  countdownTimer: null,
  lastPhase: null,
  currentPhase: null,
  lastIndex: -1,
  answered: false,
  chatLastId: 0,
  chatUnread: 0,
  chatOpen: false,
};

function mpRenderPlayerChips(container, players, opts){
  opts = opts || {};
  const sorted = opts.sortByScore ? players.slice().sort((a,b)=>b.score-a.score) : players;
  container.innerHTML = '';
  sorted.forEach(p=>{
    const chip = document.createElement('span');
    chip.className = 'mp-chip' + (p.id === mp.playerId ? ' me' : '') + (opts.winnerId && p.id === opts.winnerId ? ' winner' : '');
    const label = p.id === mp.playerId ? `${p.name}（你）` : p.name;
    chip.textContent = (opts.showScore === false) ? label : `${label} ${p.score}`;
    container.appendChild(chip);
  });
}

document.getElementById('mp-chat-form').addEventListener('submit', async (e)=>{
  e.preventDefault();

  const text = input.value.trim();
  if(!text || !mp.code || !mp.playerId) return;
  input.value = '';
  try{

    });

function mpRenderChat(messages){
  if(!messages || !messages.length) return;
  const box = document.getElementById('mp-chat-messages');
  const newest = messages[messages.length-1].id;
  if(newest <= mp.chatLastId) return;
  messages.forEach(m=>{
    if(m.id <= mp.chatLastId) return;
    const row = document.createElement('div');
    row.className = 'mp-chat-msg' + (m.playerId === mp.playerId ? ' me' : '');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = m.playerId === mp.playerId ? '你' : m.name;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;
    row.appendChild(who);
    row.appendChild(bubble);
    box.appendChild(row);
    if(m.playerId !== mp.playerId && !mp.chatOpen) mp.chatUnread++;
  });
  mp.chatLastId = newest;
  updateChatBadge();
  if(mp.chatOpen) box.scrollTop = box.scrollHeight;
}

async function startMpGame(diffKey){
  let songIds, clipSeconds, starts;
  if(diffKey === 'random'){
    const questions = buildRandomQuestions();
    songIds = questions.map(q=>q.song.id);
    clipSeconds = questions.map(q=>q.clipSeconds);
    starts = questions.map(q=>q.song.start);
  } else {
    const diff = DIFFICULTIES[diffKey];
    const pool = shuffle(eraPool());
    const picked = pool.slice(0, diff.questionCount);
    songIds = picked.map(s=>s.id);
    clipSeconds = picked.map(()=> diff.clipSeconds);
    starts = picked.map(s=>segmentStartFor(s, diffKey));
  }
  try{
    await fetch(API_BASE + '/api/start-game', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: mp.code, playerId: mp.playerId, diffKey, songIds, clipSeconds, starts })
    });
  }catch(err){
    alert('連不上伺服器');
  }
}

function mpStartPolling(){
  mpStopPolling();
  mp.lastPhase = null;
  mp.currentPhase = null;
  mp.lastIndex = -1;
  mp.answered = false;
  mpPollTick();
  mp.pollTimer = setInterval(mpPollTick, 700);
}

function mpStopPolling(){
  if(mp.pollTimer){ clearInterval(mp.pollTimer); mp.pollTimer = null; }
  if(mp.countdownTimer){ clearInterval(mp.countdownTimer); mp.countdownTimer = null; }
}

async function mpPollTick(){
  if(!mp.code) return;
  let d;
  try{
    const res = await fetch(`${API_BASE}/api/room-state?code=${mp.code}`);
    d = await res.json();
  }catch(err){ return; }
  if(!d.ok){
    mpStopPolling();
    alert('房間已消失或連線中斷，回到選單');
    mp.code = null;
    mpHideChatWidget();
    showScreen('screen-mp-menu');
    return;
  }
  mpHandleState(d);
}

function mpHandleState(d){
  const isHost = (mp.playerId === d.hostPlayerId);
  mp.isHost = isHost;
  mp.currentPhase = d.phase;
  mpRenderChat(d.chat);

  if(d.phase === 'lobby'){
    mpRenderPlayerChips(document.getElementById('mp-lobby-players'), d.players, { showScore:false });
    if(isHost){
      if(d.players.length >= 2){
        document.getElementById('mp-lobby-status').textContent = `已有 ${d.players.length} 人！選一個難度開始遊戲`;
        document.getElementById('mp-lobby-diffpick').style.display = '';
      } else {
        document.getElementById('mp-lobby-status').textContent = '⏳ 等待其他人加入…';
        document.getElementById('mp-lobby-diffpick').style.display = 'none';
      }
    } else {
      document.getElementById('mp-lobby-status').textContent = '⏳ 已加入，等待房主選擇難度…';
    }
    return;
  }

  if(!document.getElementById('screen-game').classList.contains('active')){
    enterMpGameScreen();
  }

  document.getElementById('hud-progress').textContent = `第 ${d.index+1} / ${d.total} 題`;
  document.getElementById('hud-diff').textContent = `房號 ${mp.code}`;
  document.getElementById('hud-score').textContent = '';
  const scoreboard = document.getElementById('mp-scoreboard-row');
  scoreboard.style.display = 'flex';
  mpRenderPlayerChips(scoreboard, d.players, { sortByScore:true, winnerId: d.phase==='revealed' ? d.lastRoundWinnerId : null });

  if(d.phase === 'finished'){
    mpStopPolling();
    try{ ytPlayer.pauseVideo(); }catch(err){}
    mpShowFinal(d);
    return;
  }

  const questionChanged = (d.index !== mp.lastIndex);
  if(questionChanged){
    mp.lastIndex = d.index;
    mp.answered = false;
    mpLoadQuestionUI(d);
  }

  if(d.phase !== mp.lastPhase){
    mp.lastPhase = d.phase;
    if(d.phase === 'countdown'){
      mpRunCountdown(d.clipSeconds);
    } else if(d.phase === 'revealed'){
      mpShowRoundResult(d);
    }
  }
}

    b.textContent = song.title;

function mpRunCountdown(clipSeconds){
  let n = 3;
  const label = document.getElementById('play-btn');
  label.textContent = String(n);
  document.getElementById('play-hint').textContent = `即將自動播放…${n}`;
  beep(660, 0.12);
  mp.countdownTimer = setInterval(()=>{
    n--;
    if(n > 0){
      label.textContent = String(n);
      document.getElementById('play-hint').textContent = `即將自動播放…${n}`;
      beep(660, 0.12);
    } else {
      clearInterval(mp.countdownTimer);
      mp.countdownTimer = null;
      beep(1046, 0.18);
      mpBeginAudible(clipSeconds);
    }
  }, 1000);
}

function mpBeginAudible(clipSeconds){
  try{ ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); }catch(err){ console.warn(err); }
  document.getElementById('choices').style.display = 'grid';
  setPlayingUI(true);
  document.getElementById('play-hint').textContent = `片段長度 ${clipSeconds} 秒 · 搶答中…`;
  state.questions = [{ song:null, clipSeconds }];
  state.index = 0;
  state.clipElapsedMs = 0;
  startProgressLoop();
}

async function mpSubmitAnswer(chosenSong, correctSong){
  if(mp.answered) return;
  if(mp.currentPhase !== 'playing'){
    // 還在倒數、片段還沒開始播放，先不接受作答（伺服器這時也不會收），
    // 不然畫面會被鎖住卻沒有真的送出答案，變成要空等到片段結束
    document.getElementById('play-hint').textContent = '⏳ 還沒開始，等片段播放再選';
    return;
  }
  mp.answered = true;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === chosenSong.title){
      b.classList.add(chosenSong.id === correctSong.id ? 'correct' : 'wrong');
    }
  });
  document.getElementById('play-hint').textContent = '已送出答案，等待對方…';
  try{
    await fetch(API_BASE + '/api/submit-answer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: mp.code, playerId: mp.playerId, songId: chosenSong.id })
    });
  }catch(err){ console.warn('submit-answer failed', err); }
}

function mpShowRoundResult(d){
  stopProgressLoop();
  const song = SONGS.find(s => s.id === d.correctSongId);
  document.getElementById('choices').style.display = 'grid';
  revealVinyl(song);

  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === song.title) b.classList.add('correct');
  });

  let msg;
  if(!d.lastRoundWinnerId) msg = '😅 大家都沒答對';
  else if(d.lastRoundWinnerId === mp.playerId) msg = '🎉 你搶到了這一題！';
  else msg = `${d.lastRoundWinnerName} 搶到了這一題`;
  document.getElementById('play-hint').textContent = msg;
}

function mpShowFinal(d){
  showScreen('screen-mp-result');
  const ranked = d.players.slice().sort((a,b)=>b.score-a.score);
  const me = d.players.find(p=>p.id===mp.playerId);

  // 名次計算：分數相同名次也相同（例如 1、1、3），跟正式比賽排名規則一樣
  const rankOf = [];
  ranked.forEach((p,i)=>{
    rankOf.push(i>0 && p.score===ranked[i-1].score ? rankOf[i-1] : i+1);
  });
  const myRank = me ? rankOf[ranked.findIndex(p=>p.id===mp.playerId)] : null;

  let title;
  if(d.players.length === 2){
    title = (ranked[0].score === ranked[1].score) ? '平手！' : (myRank === 1 ? '🎉 第一名！' : '第二名');
  } else {
    title = (myRank === 1) ? '🎉 第 1 名！' : `第 ${myRank} 名`;
  }
  document.getElementById('mp-result-title').textContent = title;
  document.getElementById('mp-result-sub').textContent = `你的成績：${me ? me.score : 0} 分`;

  const list = document.getElementById('mp-result-list');
  list.innerHTML = '';
  ranked.forEach((p, i)=>{
    const row = document.createElement('div');
    row.className = 'result-row' + (p.id === mp.playerId ? ' correct' : '');
    row.innerHTML = `
      <div><div class="rt">第 ${rankOf[i]} 名　${p.name}${p.id===mp.playerId ? '（你）' : ''}</div></div>
      <div class="mark">${p.score} 分</div>
    `;
    list.appendChild(row);
  });
}
</script>
